<!DOCTYPE html>
<html lang="mn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>🎵 Хөгжмийн төлөвлөгөөний сан 2026-2027</title>
<style>
  :root { --p:#2e7d32; --p2:#43a047; --a:#ff8f00; --bg:#f5f7fa; --card:#fff; --br:#e0e0e0; --tx:#212121; --m:#666; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { font-family:Arial,sans-serif; background:var(--bg); color:var(--tx); padding:14px; line-height:1.5; }
  header { text-align:center; margin-bottom:20px; padding:22px; background:linear-gradient(135deg,var(--p),var(--p2)); color:#fff; border-radius:14px; box-shadow:0 4px 14px rgba(0,0,0,.12); }
  h1 { font-size:1.7em; margin-bottom:6px; }
  header p { opacity:.95; font-size:.95em; }
  .stats { display:flex; gap:10px; justify-content:center; margin-bottom:16px; flex-wrap:wrap; }
  .stat { background:#fff; padding:10px 18px; border-radius:10px; text-align:center; box-shadow:0 2px 6px rgba(0,0,0,.06); }
  .stat b { display:block; color:var(--p); font-size:1.5em; }
  .stat small { color:var(--m); font-size:.85em; }
  .search { max-width:600px; margin:0 auto 16px; }
  .search input { width:100%; padding:12px 16px; border:2px solid var(--br); border-radius:10px; font-size:1em; background:#fff; }
  .search input:focus { outline:none; border-color:var(--p); box-shadow:0 0 0 3px rgba(46,125,50,.15); }
  .tabs { display:flex; gap:6px; margin-bottom:16px; flex-wrap:wrap; justify-content:center; }
  .tab { padding:10px 20px; background:#fff; border:2px solid var(--br); border-radius:10px; cursor:pointer; font-weight:600; font-size:.98em; transition:all .2s; }
  .tab.active { background:var(--p); color:#fff; border-color:var(--p); }
  .tab:hover:not(.active) { border-color:var(--p); color:var(--p); }
  .section { background:var(--card); border-radius:12px; padding:16px 20px; margin-bottom:14px; box-shadow:0 2px 6px rgba(0,0,0,.05); }
  .section h2 { color:var(--p); font-size:1.15em; margin-bottom:12px; padding-bottom:8px; border-bottom:2px solid #e8f5e9; display:flex; align-items:center; gap:8px; }
  .file { display:flex; align-items:center; gap:12px; padding:12px 14px; background:#fafafa; border:1px solid var(--br); border-radius:10px; margin-bottom:8px; transition:background .15s; }
  .file:hover { background:#f0f7f0; }
  .file .icon { font-size:1.7em; flex-shrink:0; }
  .file .info { flex:1; min-width:0; }
  .file .info strong { display:block; margin-bottom:2px; word-break:break-word; }
  .file .info small { color:var(--m); font-size:.85em; }
  .file .actions { display:flex; gap:6px; flex-shrink:0; }
  .btn { padding:8px 14px; border-radius:8px; text-decoration:none; font-weight:600; font-size:.88em; white-space:nowrap; border:2px solid; transition:all .15s; }
  .btn-view { background:var(--p); color:#fff; border-color:var(--p); }
  .btn-view:hover { background:#1b5e20; }
  .btn-dl { background:#fff; color:var(--a); border-color:var(--a); }
  .btn-dl:hover { background:var(--a); color:#fff; }
  .group { display:none; }
  .group.active { display:block; }
  .empty { text-align:center; color:var(--m); padding:30px; font-style:italic; }
  .note { background:#fff8e1; border-left:4px solid var(--a); padding:12px 16px; border-radius:6px; margin-bottom:14px; font-size:.92em; }
  @media (max-width:640px) { h1 { font-size:1.3em; } .tab { padding:8px 12px; font-size:.88em; } .file { flex-wrap:wrap; } .file .actions { width:100%; margin-top:6px; } .btn { flex:1; text-align:center; } }

    Сарын: [{name:"Сарын төлөвлөгөө (9 сар нэг файлд)", file:"Сарын_төлөвлөгөө_9сар"}],

const SECTION_ICONS = { "Жилийн":"📋", "Сарын":"📅", "Ээлжит_хичээлүүд":"📝", "Материалууд":"📚" };
const SECTION_NAMES = { "Жилийн":"Жилийн төлөвлөгөө", "Сарын":"Сарын төлөвлөгөө", "Ээлжит_хичээлүүд":"Ээлжит хичээлүүд", "Материалууд":"Материалууд, гарын авлага" };

function fileRow(group, subfolder, item) {
  const base = `${encodeURIComponent(group)}/${encodeURIComponent(subfolder)}/${encodeURIComponent(item.file)}`;
  const pdfUrl = `${base}.pdf`;
  const docxUrl = `${base}.docx`;
  const dlBtn = item.pdfOnly ? '' : `<a href="${docxUrl}" class="btn btn-dl" download>⬇ Word</a>`;
  return `<div class="file" data-name="${item.name.toLowerCase()}">
    <span class="icon">${item.pdfOnly ? '📕' : '📄'}</span>
    <div class="info"><strong>${item.name}</strong></div>
    <div class="actions">
      <a href="${pdfUrl}" class="btn btn-view" target="_blank">👁 Харах</a>
      ${dlBtn}
    </div>
  </div>`;
}

function render(groupKey) {
  const g = DATA[groupKey];
  let html = '';
  for (const sub in g) {
    if (sub === 'label') continue;
    const items = g[sub];
    html += `<div class="section">
      <h2>${SECTION_ICONS[sub] || '📁'} ${SECTION_NAMES[sub] || sub} <small style="font-weight:normal;color:#666;font-size:.75em;">(${items.length})</small></h2>
      ${items.map(it => fileRow(groupKey, sub, it)).join('')}
    </div>`;
  }
  return html;
}

const content = document.getElementById('content');
const tabs = document.querySelectorAll('.tab');
const search = document.getElementById('q');
let currentGroup = "1_БАГА_бүлэг";

function show(g) {
  currentGroup = g;
  tabs.forEach(t => t.classList.toggle('active', t.dataset.g === g));
  content.innerHTML = render(g);
  applySearch();
}

function applySearch() {
  const q = search.value.trim().toLowerCase();
  content.querySelectorAll('.file').forEach(f => {
    f.style.display = (!q || f.dataset.name.includes(q)) ? '' : 'none';
  });
  content.querySelectorAll('.section').forEach(s => {
    const visible = s.querySelectorAll('.file:not([style*="none"])').length;
    s.style.display = visible ? '' : 'none';
  });
}

tabs.forEach(t => t.addEventListener('click', () => show(t.dataset.g)));
search.addEventListener('input', applySearch);
show(currentGroup);
</script>
