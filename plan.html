<!DOCTYPE html>
<html lang="mn"><head><meta charset="UTF-8">
<title>Хөгжмийн жилийн төлөвлөлт 2026-2027</title>
<style>
  @page { size: A3 landscape; margin: 12mm; }
  body { font-family: "Times New Roman", serif; color:#000; padding: 20px; font-size: 11px; line-height: 1.3; max-width: 1600px; margin: 0 auto; }
  .toolbar { display:flex; gap:8px; margin-bottom:14px; flex-wrap:wrap; align-items:center; }
  .toolbar a, .toolbar button { padding:6px 12px; border:1px solid #444; border-radius:6px; text-decoration:none; color:#000; background:#fff; font-size:12px; cursor:pointer; font-family:inherit; }
  .toolbar a.active { background:#111; color:#fff; }
  .toolbar .dl { background:#059669; color:#fff; border-color:#059669; }
  .batlav { text-align:right; margin-bottom: 20px; font-size:12px; }
  .head { text-align:center; margin-bottom: 20px; }
  .head h1 { font-size: 15px; font-weight:bold; text-transform:uppercase; margin: 6px 0; }
  .head .date { font-size: 12px; margin-top: 6px; }
  table { width:100%; border-collapse: collapse; font-size:10px; margin: 10px 0; }
  th, td { border:1px solid #000; padding:3px 4px; vertical-align:middle; text-align:center; }
  th { background:#e5e7eb; font-weight:bold; }
  .ai, .dai, .urdun { text-align:left; font-weight:600; }
  .urdun { font-size:9.5px; }
  .n1 { background:#c6efce; }
  .n2 { background:#9bc2e6; }
  .u1 { background:#ffe699; }
  .u2 { background:#f4b183; }
  .bt { background:#d9d9d9; }
  .legend { margin-top: 20px; font-size:11px; }
  .legend div { display:flex; align-items:center; gap:8px; margin: 4px 0; }
  .legend .sw { display:inline-block; width:20px; height:14px; border:1px solid #000; }
  .note { margin-top:14px; font-size:11px; font-style:italic; }
  .sig { margin-top: 30px; font-size: 12px; text-align:right; }
  @media print { body { padding: 0; } .toolbar, .no-print { display:none !important; } }
</style></head>
<body>

<div class="toolbar no-print">
  <strong style="margin-right:8px">Түвшин:</strong>
  <a href="#1" data-lvl="1">I · Бага</a>
  <a href="#2" data-lvl="2">II · Дунд</a>
  <a href="#3" data-lvl="3">III · Ахлах</a>
  <a href="#4" data-lvl="4">IV · Бэлтгэл</a>
  <span style="flex:1"></span>
  <button onclick="window.print()">🖨 Хэвлэх</button>
  <button class="dl" onclick="downloadCurrent()">📥 Татаж авах</button>
</div>

<div id="plan"></div>

<script>
const CROSS = ["БНО4.1в","ХЯ4.1а","ХЯ4.1б","НСХ4.1а","БНО4.2д","ХЭМ4.1г","БНО4.2в","ХЯ4.2в"];

const LEVELS = {
  1: {
    title: "БАГА БҮЛГИЙН ХӨГЖМИЙН СУДЛАГДАХУУНЫ",
    hours: 2,
    outcomes: [
      { dai:"Мэдрэх", code:"ХӨГ1.1а", text:"Хүн, амьтны дуу авиаг ялган таньдаг болно." },
      { dai:"Илэрхийлэх", code:"ХӨГ1.1б", text:"Дууг анхааралтай сонсож, зарим үг, авиаг дуурайн хэлж, аялна." },
      { dai:"Бүтээх", code:"ХӨГ1.1в", text:"Дуу, аялгууны хэмнэлд тохируулан хөдөлгөөн хийнэ." }
    ]
  },
  2: {
    title: "ДУНД БҮЛГИЙН ХӨГЖМИЙН СУДЛАГДАХУУНЫ",
    hours: 2,
    outcomes: [
      { dai:"Мэдрэх", code:"ХӨГ2.1а", text:"Байгаль, эд юмсын дуу чимээг ялгана." },
      { dai:"Илэрхийлэх", code:"ХӨГ2.1б", text:"Дууны аялгууг дагаж, аялна." },
      { dai:"Илэрхийлэх", code:"ХӨГ2.1в", text:"Жигд хэмнэлийг мэдэрч, биеийн хөдөлгөөнөөр илэрхийлнэ." },
      { dai:"Бүтээх", code:"ХӨГ2.1г", text:"Дуу, аялгуунд тохирсон хөдөлгөөн хийнэ." },
      { dai:"Бүтээх", code:"ХӨГ2.1д", text:"Үлгэр зохиол, дуу хөгжмийн дүрд тоглоно." }
    ]
  },
  3: {
    title: "АХЛАХ БҮЛГИЙН ХӨГЖМИЙН СУДЛАГДАХУУНЫ",
    hours: 2,
    outcomes: [
      { dai:"Мэдрэх", code:"ХӨГ3.1а", text:"Хөгжмийн энгийн зэмсгийн дуу чимээг ялган таньдаг болно." },
      { dai:"Илэрхийлэх", code:"ХӨГ3.1б", text:"Богино үгтэй дууг аялгууны дагуу дуулна." },
      { dai:"Илэрхийлэх", code:"ХӨГ3.1в", text:"Жигд ба жигд бус хэмнэлийг ялгана." },
      { dai:"Бүтээх", code:"ХӨГ3.1г", text:"Аялгууны өөрчлөлтийг мэдэрч илэрхийлнэ." },
      { dai:"Бүтээх", code:"ХӨГ3.1д", text:"Үлгэр зохиол, дуу, аялгууны дүрийг тоглоно." }
    ]
  },
  4: {
    title: "БЭЛТГЭЛ БҮЛГИЙН ХӨГЖМИЙН СУДЛАГДАХУУНЫ",
    hours: 3,
    outcomes: [
      { dai:"Мэдрэх", code:"ХӨГ4.1а", text:"Хөгжмийн энгийн зэмсгийг дуугаралтаар ялгаж, өнгө аясыг тодорхойлно." },
      { dai:"Илэрхийлэх", code:"ХӨГ4.1б", text:"Дуу, аялгууг гарын дохиогоор дуулж, аялна." },
      { dai:"Илэрхийлэх", code:"ХӨГ4.1в", text:"Аялгуу, хэмнэлийн дагуу хамтран хөгжимдөнө." },
      { dai:"Бүтээх", code:"ХӨГ4.1г", text:"Хэмнэл, хурд, өнгө аяст тохируулан хөдөлгөөнөө илэрхийлнэ." },
      { dai:"Бүтээх", code:"ХӨГ4.1д", text:"Дүрийн зан чанар, харилцааг илэрхийлж хамтран тоглоно." }
    ]
  }
};

// Generate 36 cells (9 months × 4 columns) per row for a given code
// Pattern per 14-хоног: col1=шинэ мэдлэг, col2=уялдаа. Also inject бататгал periodically.
function generateCells(code, seed) {
  const cells = [];
  const lvl = code.match(/ХӨГ(\d)/)[1];
  const crossByLvl = CROSS.map(c => c.replace(/^([А-Я]+)4/, `$1${lvl}`));
  for (let m = 0; m < 9; m++) {
    for (let half = 0; half < 2; half++) {
      // Column 1 of the 14-хоног: new knowledge or бататгал
      const isBt = (m === 3 && half === 0) || (m === 5 && half === 1) || (m === 8 && half === 0) || (m === 8 && half === 1);
      cells.push({ cls: isBt ? "bt" : (half === 0 ? "n1" : "n2"), code });
      // Column 2: уялдаа
      const cross = crossByLvl[(seed + m*2 + half) % crossByLvl.length];
      cells.push({ cls: half === 0 ? "u1" : "u2", code: cross });
    }
  }
  return cells;
}

function render(level) {
  const L = LEVELS[level];
  const months = ["09 сар","10 сар","11 сар","12 сар","1 сар","2 сар","3 сар","4 сар","5 сар"];
  let html = `
    <div class="batlav">
      БАТЛАВ<br>АРГА ЗҮЙЧ:  ...................................<br>2026 оны 09 сарын ...... өдөр
    </div>
    <div class="head">
      <h1>${L.title}</h1>
      <h1>2026-2027 ОНЫ ХИЧЭЭЛИЙН ЖИЛИЙН СУРГАЛТЫН ХӨТӨЛБӨР</h1>
      <div class="date">7 хоногт ${L.hours} цаг · 2026 оны 09 сарын 01</div>
    </div>
    <table>
      <thead>
        <tr>
          <th rowspan="3" style="width:90px">Ай</th>
          <th rowspan="3" style="width:75px">Дэд ай</th>
          <th rowspan="3" style="width:250px">Суралцахуйн үр дүн</th>
          ${months.map(m => `<th colspan="4">${m}</th>`).join("")}
        </tr>
        <tr>${months.map(() => `<th colspan="2">I-14 хон.</th><th colspan="2">II-14 хон.</th>`).join("")}</tr>
        <tr>${Array.from({length:36}, (_,i)=>`<th style="width:22px">${i+1}</th>`).join("")}</tr>
      </thead>
      <tbody>
        ${L.outcomes.map((o, i) => {
          const cells = generateCells(o.code, i);
          return `<tr>
            <td class="ai">Хөгжмийн илэрхийлэл</td>
            <td class="dai">${o.dai}</td>
            <td class="urdun">${o.code}. ${o.text.replace(o.code+".","").trim()}</td>
            ${cells.map(c => `<td class="${c.cls}">${c.code}</td>`).join("")}
          </tr>`;
        }).join("")}
      </tbody>
    </table>
    <div class="legend">
      <strong>Тэмдэглэгээ:</strong>
      <div><span class="sw n1"></span> Шинэ мэдлэг (эхний 14 хоног)</div>
      <div><span class="sw n2"></span> Шинэ мэдлэг (сүүлийн 14 хоног)</div>
      <div><span class="sw u1"></span> Уялдаа 1 (эхний 14 хоногийн)</div>
      <div><span class="sw u2"></span> Уялдаа 2 (сүүлийн 14 хоногийн)</div>
      <div><span class="sw bt"></span> Бататгал</div>
    </div>
    <div class="note">
      Сарын төлөвлөлтийг 14 хоногоор буюу сард 2 удаа хийхээр төлөвлөж, 14 хоногтоо 2 шинэ мэдлэг олгохоор төлөвлөж хийсэн.<br>
      Уялдаа холбоо: <strong>БНО</strong> — Байгаль нийгмийн орчин, <strong>ХЯ</strong> — Хэл яриа, <strong>НСХ</strong> — Нийгэм-сэтгэл хөдлөл, <strong>ХЭМ</strong> — Математик, <strong>ХӨГ</strong> — Хөгжим.
    </div>
    <div class="sig">ХӨТӨЛБӨР БОЛОВСРУУЛСАН: ХӨГЖМИЙН БАГШ <strong>Г.ӨЛЗИЙБАЯР</strong></div>`;
  document.getElementById("plan").innerHTML = html;
  document.querySelectorAll(".toolbar a").forEach(a => a.classList.toggle("active", a.dataset.lvl === String(level)));
  document.title = `${L.title.replace(/ХӨГЖМИЙН СУДЛАГДАХУУНЫ/,'').trim()} — Жилийн төлөвлөлт 2026-2027`;
}

function currentLevel() {
  const h = parseInt(location.hash.replace("#","")) || 4;
  return [1,2,3,4].includes(h) ? h : 4;
}
function downloadCurrent() {
  const lvl = currentLevel();
  const names = {1:"бага",2:"дунд",3:"ахлах",4:"бэлтгэл"};
  const html = "<!DOCTYPE html>\n" + document.documentElement.outerHTML;
  const blob = new Blob([html], {type:"text/html;charset=utf-8"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = `жилийн_төлөвлөлт_${names[lvl]}_2026_2027.html`;
  a.click();
  URL.revokeObjectURL(url);
}
window.addEventListener("hashchange", () => render(currentLevel()));
render(currentLevel());
</script>
</body></html>
